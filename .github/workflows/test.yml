name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıklar (arayüz hariç çekirdek)
        run: pip install pymupdf pillow python-docx openpyxl pytest
      - name: Çekirdek testleri
        run: pytest -q
